services:
  db:
    image: postgres:17
    container_name: mailpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:contenedor. Solo escucha en localhost: la base de datos no
      # queda expuesta a la red desde la que esté conectado el portátil.
      #
      # 5433 por fuera, no 5432: este Mac ya tiene un PostgreSQL nativo
      # ocupando el 5432. Dentro del contenedor sigue siendo el 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Sin esto, "docker compose up" da el contenedor por listo en cuanto
      # arranca, pero Postgres tarda unos segundos más en aceptar conexiones.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Volumen con nombre: los datos sobreviven a "docker compose down".
  # Solo se borran con "docker compose down -v".
  pgdata:
