[pytest]
# src/ al path para poder importar mailpilot sin instalar el paquete.
# Es la versión limpia del sys.path.insert que hacen los scripts.
#
# La raíz (.) también, porque unos tests importan helpers de otros
# (`from tests.test_repository import make_email`). Sin esto solo funciona
# `python -m pytest`, que añade el directorio actual por su cuenta; `pytest`
# a secas fallaba al recolectar.
pythonpath = src .
testpaths = tests

# Marca los tests que necesitan PostgreSQL levantado, para poder saltarlos:
#   pytest -m "not db"
markers =
    db: necesita la base de datos en marcha (docker compose up -d)
