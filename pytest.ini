[pytest]
# src/ al path para poder importar mailpilot sin instalar el paquete.
# Es la versión limpia del sys.path.insert que hacen los scripts.
pythonpath = src
testpaths = tests

# Marca los tests que necesitan PostgreSQL levantado, para poder saltarlos:
#   pytest -m "not db"
markers =
    db: necesita la base de datos en marcha (docker compose up -d)
