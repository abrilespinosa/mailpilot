[pytest]
# `src` YA NO VA AQUÍ. El paquete se instala de verdad (`pip install -e .`),
# así que `import mailpilot` funciona solo. Dejarlo sería peor que inútil:
# los tests pasarían aunque la instalación estuviera rota, y el fallo saldría
# en CI o en la máquina de quien clone el repo. Ver ADR 005.
#
# La raíz (.) sí sigue, por otro motivo: unos tests importan helpers de otros
# (`from tests.test_repository import make_email`), y `tests/` no es un paquete
# instalable ni debe serlo.
pythonpath = .
testpaths = tests

# Marca los tests que necesitan PostgreSQL levantado, para poder saltarlos:
#   pytest -m "not db"
markers =
    db: necesita la base de datos en marcha (docker compose up -d)
